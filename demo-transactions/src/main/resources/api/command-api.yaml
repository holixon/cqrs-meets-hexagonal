openapi: 3.0.3
info:
  title: CQRS meets hexagonal - OpenAPI 3.0
  version: 1.0.11
tags:
  - name: customer
  - name: account

paths:
  /api/v1/customer/create:
    post:
      tags:
        - customer
      summary: >
        Create a customer
      description: >
        Create a customer
      operationId: createCustomer
      requestBody:
        description: Customer to be created
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
              required:
                - name

      responses:
        '200':
          description: created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/v1/account/create:
    post:
      tags:
        - account
      summary: >
        Create an account for a customer
      description: >
        Create an account for a customer
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                customerNumber:
                  type: string
              required:
                - customerNumber
      responses:
        '200':
          description: created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedResponse'
  /api/v1/account/deposit:
    post:
      tags:
        - account
      summary: >
        Deposit money
      description: >
        Deposit money for a specified account
      operationId: deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                iban:
                  type: string
                amount:
                  type: number
                  format: double
              required:
                - iban
                - amount
      responses:
        '204':
          description: Money Deposited
        '404':
          description: No Account found

components:
  schemas:
    AccountCreatedResponse:
      type: object
      properties:
        customerNumber:
          type: string
        iban:
          type: string
      required:
        - customerNumber
        - iban
    Customer:
      type: object
      properties:
        customerNumber:
          type: string
        name:
          type: string
      required:
        - customerNumber
        - name