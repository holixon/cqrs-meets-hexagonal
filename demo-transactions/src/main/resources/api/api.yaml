openapi: 3.0.3
info:
  title: CQRS meets hexagonal - OpenAPI 3.0
  description: |-
  termsOfService: https://swagger.io/terms/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
externalDocs:
  description: Find out more about Swagger
  url: https://swagger.io
servers:
  - url: http://localhost:8080
tags:
  - name: customer
  - name: account

paths:
  /api/v1/customer/create:
    post:
      tags:
        - customer
      summary: >
        Create a customer
      description: >
        Create a customer
      operationId: createCustomer
      requestBody:
        description: Customer to be created
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
              required:
                - name

      responses:
        '200':
          description: created customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /api/v1/account/create:
    post:
      tags:
        - account
      summary: >
        Create an account for a customer
      description: >
        Create an account for a customer
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                customerNumber:
                  type: string
              required:
                - customerNumber
      responses:
        '200':
          description: created account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreatedResponse'
  /api/v1/account/deposit:
    post:
      tags:
        - account
      summary: >
        Deposit money
      description: >
        Deposit money for a specified account
      operationId: deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                iban:
                  type: string
                amount:
                  type: number
                  format: double
              required:
                - iban
                - amount
      responses:
        '204':
          description: Money Deposited
        '404':
          description: No Account found
  /api/v1/account/withdraw:
    post:
      tags:
        - account
      summary: >
        Withdraw money
      description: >
        Withdraw money for a specified account
      operationId: withdraw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequestDto'
      responses:
        '204':
          description: Money withdrew
        '404':
          description: No Account found

  /api/v1/account/balance:
    get:
      tags:
        - accountBalance
      summary: >
        Gets balance for account
      description: >
        Gets the balance for the account specified
      operationId: getBalance
      parameters:
        - name: accountNumber
          in: query
          description: Account identifier
          required: true
          schema:
            type: string
            example: DE01123456780000000001
      responses:
        '200':
          description: Balance details for account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'
        '400':
          description: Invalid parameters
        '404':
          description: Account not found for balance
        '500':
          description: Internal error with request

components:
  schemas:
    AccountCreatedResponse:
      type: object
      properties:
        customerNumber:
          type: string
        iban:
          type: string
      required:
        - customerNumber
        - iban
    Customer:
      type: object
      properties:
        customerNumber:
          type: string
        name:
          type: string
      required:
        - customerNumber
        - name
    AccountBalanceResponse:
      type: object
      properties:
        accountNumber:
          type: string
          description: The account number
        balance:
          type: number
          format: decimal
          description: The balance of the account
      required:
        - accountNumber
        - balance
    WithdrawRequestDto:
      type: object
      properties:
         iban:
           type: string
         amount:
           type: number
           format: double
      required:
        - iban
        - amount